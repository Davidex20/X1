name: Build Xcology Code AI APK
on:
  push:
    branches: [main, xcology-code-ai]
    paths:
      - 'xcology-code-ai/**'
      - '.github/workflows/xcology-code-ai.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xcology-code-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Xcology-Code-AI-debug-apk
          path: xcology-code-ai/app/build/outputs/apk/debug/*.apk
